<main class="courses-management">
  <header class="courses-management__topbar">
    <div>
      <span class="eyebrow">Gestão acadêmica</span>
      <h1>Cursos</h1>
      <p class="page-subtitle">Painel administrativo para cadastro e gestão de cursos.</p>
    </div>
    <button type="button" class="new-course-btn" (click)="openCreate()" [disabled]="saving || loadingList">Novo curso</button>
  </header>

  <p class="local-feedback" *ngIf="localFeedback">{{ localFeedback }}</p>

  <section class="courses-management__layout">
    <app-course-list
      [cursos]="pagedCursos"
      [loading]="loadingList || saving"
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [deletingCursoId]="deletingCursoId"
      (search)="onSearch($event)"
      (edit)="openEdit($event)"
      (remove)="onDelete($event)"
      (pageChange)="onPageChange($event)"
    ></app-course-list>
  </section>

  <div class="modal-overlay" *ngIf="panelOpen" (click)="closePanel()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <app-course-form
        [mode]="formMode"
        [curso]="selectedCurso"
        [loading]="saving"
        (save)="onSave($event)"
        (cancel)="closePanel()"
      ></app-course-form>
    </div>
  </div>
</main>
