<div class="notas-page">
  <header class="notas-header">
    <h1>Notas</h1>
  </header>

  <div class="filters">
    <label>
      Turma:
      <select [ngModel]="selectedTurma?.idTurma ?? ''" (ngModelChange)="onTurmaChange($event)">
        <option value="" disabled>Selecione uma turma</option>
        <option *ngFor="let turma of turmas" [value]="turma.idTurma">
          #{{ turma.idTurma }} — {{ turma.curso?.nomeCurso ?? 'Sem curso' }}
        </option>
      </select>
    </label>
    <label *ngIf="selectedTurma">
      Prova:
      <select [ngModel]="prova" (ngModelChange)="onProvaChange($event)">
        <option *ngFor="let opt of provaOptions" [value]="opt.value">{{ opt.label }} {{ opt.peso ? '(peso ' + opt.peso + ')' : '' }}</option>
      </select>
    </label>
  </div>

  <p *ngIf="loadingTurmas" class="loading">Carregando turmas...</p>
  <p *ngIf="!loadingTurmas && turmas.length === 0" class="empty">Nenhuma turma atribuída a você.</p>

  <div *ngIf="selectedTurma">
    <p *ngIf="loadingNotas" class="loading">Carregando notas...</p>
    <p *ngIf="feedback" class="error">{{ feedback }}</p>

    <div *ngIf="!loadingNotas && students.length === 0" class="empty">
      Nenhum aluno matriculado nesta turma.
    </div>

    <div class="table-wrap" *ngIf="!loadingNotas && students.length > 0">
    <table class="notas-table">
      <thead>
        <tr>
          <th>Aluno</th>
          <th>Nota</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of students">
          <td>{{ s.nomeAluno }}</td>
          <td>
            <input
              type="number"
              step="0.1"
              min="0"
              max="10"
              [ngModel]="s.nota"
              (ngModelChange)="onNotaChange(s.idMatricula, $event)"
              placeholder="0.0"
            />
          </td>
        </tr>
      </tbody>
    </table>
    </div>

    <button *ngIf="students.length > 0" type="button" class="save-btn" [disabled]="saving" (click)="save()">
      {{ saving ? 'Salvando...' : 'Salvar Notas' }}
    </button>
  </div>
</div>
