<div class="dashboard">
  <header class="dashboard__header">
    <h1>Dashboard Gerencial</h1>
    <p>Visão panorâmica do sistema ABACO</p>
  </header>

  <div class="kpi-grid" *ngIf="!loading; else loadingState">
    <a class="kpi-card" routerLink="/admin/alunos">
      <div class="kpi-card__icon kpi-card__icon--blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div class="kpi-card__info">
        <span class="kpi-card__value">{{ kpis.total_alunos_ativos }}</span>
        <span class="kpi-card__label">Alunos Ativos</span>
      </div>
    </a>

    <a class="kpi-card" routerLink="/admin/turmas">
      <div class="kpi-card__icon kpi-card__icon--green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
      </div>
      <div class="kpi-card__info">
        <span class="kpi-card__value">{{ kpis.total_turmas_vigentes }}</span>
        <span class="kpi-card__label">Turmas Vigentes</span>
      </div>
    </a>

    <a class="kpi-card" routerLink="/admin/logistico/pedidos">
      <div class="kpi-card__icon kpi-card__icon--orange">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>
      <div class="kpi-card__info">
        <span class="kpi-card__value">{{ kpis.total_pedidos_pendentes }}</span>
        <span class="kpi-card__label">Pedidos Pendentes</span>
      </div>
    </a>

    <a class="kpi-card" routerLink="/admin/logistico/estoque">
      <div class="kpi-card__icon kpi-card__icon--red">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="kpi-card__info">
        <span class="kpi-card__value">{{ kpis.total_estoque_critico }}</span>
        <span class="kpi-card__label">Estoque Crítico</span>
      </div>
    </a>
  </div>

  <div class="charts-grid" *ngIf="!loading; else loadingState">
    <div class="chart-card">
      <apx-chart
        [series]="donutSeries"
        [chart]="donutChart"
        [labels]="donutLabels"
        [title]="donutTitle"
        [legend]="donutLegend"
        [responsive]="donutResponsive"
        [dataLabels]="donutDataLabels"
        [fill]="donutFill"
      ></apx-chart>
    </div>

    <div class="chart-card">
      <apx-chart
        [series]="barSeries"
        [chart]="barChart"
        [title]="barTitle"
        [plotOptions]="barPlotOptions"
        [dataLabels]="barDataLabels"
        [fill]="barFill"
        [xaxis]="barXaxis"
      ></apx-chart>
    </div>

    <div class="chart-card chart-card--full">
      <apx-chart
        [series]="consumoSeries"
        [chart]="consumoChart"
        [title]="consumoTitle"
        [plotOptions]="consumoPlotOptions"
        [dataLabels]="consumoDataLabels"
        [fill]="consumoFill"
        [xaxis]="consumoXaxis"
        [tooltip]="consumoTooltip"
      ></apx-chart>
    </div>
  </div>

  <ng-template #loadingState>
    <div class="loading-container">
      <span class="spinner"></span>
      <p>Carregando dashboard...</p>
    </div>
  </ng-template>
</div>
