<div class="error-page">
  <div class="error-card">
    <h1 class="error-card__code">404</h1>
    <h2 class="error-card__title">Página não encontrada</h2>
    <p class="error-card__message">
      A página que você está procurando não existe ou foi movida.
    </p>
    <div class="error-card__actions">
      <button type="button" class="error-card__btn error-card__btn--primary" (click)="goHome()">
        Ir para o início
      </button>
    </div>
  </div>
</div>
