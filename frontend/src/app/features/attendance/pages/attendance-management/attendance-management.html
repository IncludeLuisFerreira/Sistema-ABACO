<main class="attendance-management">
  <header class="attendance-management__topbar">
    <div>
      <span class="eyebrow">Gestão acadêmica</span>
      <h1>Presenças</h1>
      <p class="page-subtitle">Registre a presença dos alunos por turma e data.</p>
    </div>
    <button
      type="button"
      class="save-btn"
      (click)="onSave()"
      [disabled]="saving || !selectedTurma || !dataAula || students.length === 0 || loadingPresencas || loadFailed"
    >
      <span *ngIf="saving" class="spinner" aria-hidden="true"></span>
      {{ saving ? 'Salvando...' : 'Salvar presencas' }}
    </button>
  </header>

  <p class="local-feedback" *ngIf="localFeedback">{{ localFeedback }}</p>

  <section class="abaco-field-card attendance-management__controls">
    <label class="abaco-field-card__field">
      <span class="abaco-field-card__label">Turma</span>
      <select class="abaco-select" (change)="onTurmaChange($event)" [disabled]="loadingTurmas || saving">
        <option value="" disabled selected>Selecione uma turma</option>
        <option *ngFor="let turma of turmas" [value]="turma.idTurma">
          #{{ turma.idTurma }} — {{ turma.curso?.nomeCurso ?? 'Sem curso' }}
        </option>
      </select>
    </label>
    <p class="dias-aula-info" *ngIf="selectedTurma?.diasAula">
      Periodo: <strong>{{ periodoLabel }}</strong>
      &nbsp;|&nbsp; Dias: <strong>{{ diasAulaLabel }}</strong>
    </p>
  </section>

  <app-attendance-list
    [students]="students"
    [loading]="loadingPresencas"
    [dataAula]="dataAula"
    [turmaNome]="selectedTurma?.curso?.nomeCurso ?? ''"
    [saving]="saving"
    (togglePresenca)="onTogglePresenca($event)"
    (dataAulaChange)="onDataAulaChange($event)"
  ></app-attendance-list>
</main>
