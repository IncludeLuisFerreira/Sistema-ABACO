<main class="grades-management">
  <header class="grades-management__topbar">
    <div>
      <span class="eyebrow">Gestão acadêmica</span>
      <h1>Notas</h1>
      <p class="page-subtitle">Lance e acompanhe as notas dos alunos por turma e prova.</p>
    </div>
    <button
      type="button"
      class="btn btn--primary"
      (click)="onSave()"
      [disabled]="saving || !selectedTurma || students.length === 0 || loadingNotas || loadFailed"
    >
      <span *ngIf="saving" class="spinner" aria-hidden="true"></span>
      {{ saving ? 'Salvando...' : 'Salvar notas' }}
    </button>
  </header>

  <p class="local-feedback" *ngIf="localFeedback">{{ localFeedback }}</p>

  <section class="abaco-field-card grades-management__controls">
    <label class="abaco-field-card__field">
      <span class="abaco-field-card__label">Turma</span>
      <select class="abaco-select" (change)="onTurmaChange($event)" [disabled]="loadingTurmas || saving">
        <option value="" disabled selected>Selecione uma turma</option>
        <option *ngFor="let turma of turmas" [value]="turma.idTurma">
          #{{ turma.idTurma }} — {{ turma.curso?.nomeCurso ?? 'Sem curso' }}
        </option>
      </select>
    </label>
  </section>

  <app-grades-list
    [students]="students"
    [loading]="loadingNotas"
    [turmaNome]="selectedTurma?.curso?.nomeCurso ?? ''"
    [prova]="prova"
    [saving]="saving"
    [avaliacoes]="selectedTurma?.avaliacoes ?? null"
    (notaChange)="onNotaChange($event)"
    (provaChange)="onProvaChange($event)"
  ></app-grades-list>

  <app-grades-average-chart
    *ngIf="selectedTurma"
    [turmaId]="selectedTurma.idTurma"
    [turmaNome]="selectedTurma.curso?.nomeCurso ?? ''"
  ></app-grades-average-chart>
</main>
