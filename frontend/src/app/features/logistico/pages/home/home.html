<div class="logistico-dashboard">
  <header class="logistico-dashboard__header">
    <h1>Logístico</h1>
    <p>Gerencie o estoque e os pedidos de materiais da ABACO.</p>
  </header>

  <section class="logistico-dashboard__section">
    <h2 class="logistico-dashboard__section-title">Acesso rápido</h2>
    <div class="logistico-dashboard__cards">
      <a class="card" routerLink="/admin/logistico/estoque">
        <h2>Estoque</h2>
        <p>Visualizar, cadastrar e gerenciar itens do estoque</p>
      </a>
      <a class="card" routerLink="/admin/logistico/pedidos">
        <h2>Pedidos</h2>
        <p>Listar, aprovar e acompanhar pedidos de material</p>
      </a>
      <a class="card" routerLink="/admin/logistico/pedidos/novo">
        <h2>Novo Pedido</h2>
        <p>Criar uma nova solicitação de material</p>
      </a>
    </div>
  </section>
</div>
