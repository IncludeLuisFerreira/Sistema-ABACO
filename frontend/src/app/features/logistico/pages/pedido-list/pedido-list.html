<main class="pedido-list">
  <header class="pedido-list__topbar">
    <div class="pedido-list__heading">
      <span class="eyebrow">Módulo logístico</span>
      <h1>Pedidos</h1>
      <p>Visualize e gerencie as solicitações de materiais.</p>
    </div>
    <button type="button" class="new-pedido-btn" (click)="newPedido()" [disabled]="loadingList">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
      Novo pedido
    </button>
  </header>

  <label class="pedido-filter">
    <span class="pedido-filter__label">Exibir</span>
    <select class="pedido-filter__select" [value]="activeTab" (change)="onTabChange($event)">
      <option value="todos">Todos os Pedidos</option>
      <option value="lista-compras">Lista de Compras ({{ approvedPedidos.length }})</option>
    </select>
  </label>

  <app-pedido-table
    [pedidos]="filteredPedidos"
    [loading]="loadingList"
    [currentUserCargo]="currentUserCargo"
    (approve)="onApprove($event)"
    (confirmPurchase)="onConfirmPurchase($event)"
    (deliver)="onDeliver($event)"
    (remove)="onDelete($event)"
  ></app-pedido-table>
</main>
