<section class="form-card" aria-label="Formulario de usuario">
  <header>
    <h2>{{ mode === 'create' ? 'Novo colaborador' : 'Editar colaborador' }}</h2>
    <p>{{ mode === 'create' ? 'Cadastre um novo acesso ao sistema.' : 'Atualize dados e perfil de acesso.' }}</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Nome *</span>
      <input formControlName="nome" type="text" placeholder="Nome completo" autocomplete="name" />
      <small class="error" *ngIf="form.controls.nome.errors?.['required'] && form.controls.nome.touched">Nome e obrigatorio.</small>
      <small class="error" *ngIf="form.controls.nome.errors?.['personName'] && form.controls.nome.touched">
        Use ao menos 3 letras (sem numeros ou simbolos).
      </small>
    </label>

    <label>
      <span>E-mail *</span>
      <input formControlName="email" type="email" placeholder="nome@abaco.org.br" autocomplete="email" />
      <small class="error" *ngIf="form.controls.email.errors?.['required'] && form.controls.email.touched">E-mail e obrigatorio.</small>
      <small class="error" *ngIf="form.controls.email.errors?.['email'] && form.controls.email.touched">Informe um e-mail valido.</small>
      <small class="error" *ngIf="form.controls.email.errors?.['institutionalEmail'] && form.controls.email.touched">
        Use um e-mail @abaco.org.br.
      </small>
      <small class="error" *ngIf="form.controls.email.errors?.['emailTaken'] && form.controls.email.touched">
        Este e-mail ja esta cadastrado.
      </small>
    </label>

    <label>
      <span>Telefone</span>
      <input
        formControlName="telefone"
        type="tel"
        inputmode="numeric"
        placeholder="(00) 00000-0000"
        maxlength="15"
        (input)="onTelefoneInput($event)"
      />
      <small class="error" *ngIf="form.controls.telefone.invalid && form.controls.telefone.touched">
        Informe DDD + 9 digitos (ex: 11999999999).
      </small>
    </label>

    <label>
      <span>Nivel de acesso *</span>
      <select formControlName="cargo">
        <option *ngFor="let option of roleOptions" [value]="option.value">{{ option.label }}</option>
      </select>
    </label>

    <label *ngIf="mode === 'create'">
      <span>Senha provisoria *</span>
      <input formControlName="senha" type="password" placeholder="Defina uma senha inicial" autocomplete="new-password" />
      <small class="error" *ngIf="form.controls.senha.invalid && form.controls.senha.touched">Senha e obrigatoria para cadastro.</small>
    </label>

    <footer>
      <button type="button" class="btn btn--ghost" (click)="cancel.emit()" [disabled]="loading">Cancelar</button>
      <button type="submit" class="btn btn--primary" [disabled]="loading">
        <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
        {{ loading ? 'Salvando...' : 'Salvar' }}
      </button>
    </footer>
  </form>
</section>
