<div class="page-center">
  <div class="login-card" role="region" aria-label="Alterar senha">
    <div class="brand">
      <img src="/Logo_ABACO.png" alt="ABACO" class="logo" />
    </div>
    <h1>Alteração de Senha Obrigatória</h1>
    <p class="description">Este é o seu primeiro acesso. Para continuar, defina uma nova senha.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <ab-password-field [control]="form.controls.senha_atual" [label]="'Senha Atual'" [placeholder]="'Digite a senha recebida'"></ab-password-field>

      <ab-password-field [control]="form.controls.nova_senha" [label]="'Nova Senha'" [placeholder]="'Mínimo de 8 caracteres com letras e números'"></ab-password-field>

      <ab-password-field [control]="form.controls.confirmar_senha" [label]="'Confirmar Nova Senha'" [placeholder]="'Repita a nova senha'"></ab-password-field>

      <ab-primary-button [disabled]="form.invalid || loading" [label]="loading ? 'Alterando...' : 'Alterar Senha'">
        <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
      </ab-primary-button>

      <div class="error" *ngIf="error">{{ error }}</div>
      <div class="success" *ngIf="success">{{ success }}</div>
    </form>
  </div>
</div>
