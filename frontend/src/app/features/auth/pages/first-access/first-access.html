<div class="page-center">
  <div class="login-card" role="region" aria-label="Definir senha de primeiro acesso">
    <div class="brand">
      <img src="/Logo_ABACO.png" alt="ABACO" class="logo" />
    </div>
    <h1>Primeiro Acesso</h1>
    <p class="description">Defina sua senha pessoal para começar a usar o sistema.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate *ngIf="token; else noToken">
      <ab-password-field [control]="form.controls.nova_senha" [label]="'Nova Senha'" [placeholder]="'Mínimo de 8 caracteres com letras e números'"></ab-password-field>

      <ab-password-field [control]="form.controls.confirmar_senha" [label]="'Confirmar Nova Senha'" [placeholder]="'Repita a nova senha'"></ab-password-field>

      <ab-primary-button [disabled]="form.invalid || loading" [label]="loading ? 'Salvando...' : 'Definir Senha'">
        <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
      </ab-primary-button>

      <div class="error" *ngIf="error">{{ error }}</div>
      <div class="success" *ngIf="success">{{ success }}</div>
    </form>

    <ng-template #noToken>
      <div class="error">Token de primeiro acesso não encontrado.</div>
    </ng-template>

    <div class="auth-links">
      <a routerLink="/login" class="auth-link">Voltar para o login</a>
    </div>
  </div>
</div>
