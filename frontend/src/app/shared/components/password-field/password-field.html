<label [attr.for]="fieldId">{{ label }}</label>
<div class="password-row">
  <input
    [id]="fieldId"
    [type]="show ? 'text' : 'password'"
    [formControl]="control"
    [placeholder]="placeholder"
    [attr.aria-invalid]="showError ? 'true' : null"
    [attr.aria-describedby]="showError ? fieldId + '-error' : null"
  />
  <button type="button" class="eye" (click)="toggle()" aria-label="Mostrar senha">{{ show ? '🙈' : '👁️' }}</button>
</div>
<div
  class="field-error"
  *ngIf="showError"
  [id]="fieldId + '-error'"
  role="alert"
  aria-live="polite"
>
  <small>{{ errorMessage }}</small>
</div>
