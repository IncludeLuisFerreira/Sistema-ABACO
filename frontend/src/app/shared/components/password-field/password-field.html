<label [attr.for]="'pwd-' + (control?.id || '')">{{ label }}</label>
<div class="password-row">
  <input [id]="'pwd-' + (control?.id || '')" [type]="show ? 'text' : 'password'" [formControl]="control" [placeholder]="placeholder" />
  <button type="button" class="eye" (click)="toggle()" aria-label="Mostrar senha">{{ show ? '🙈' : '👁️' }}</button>
</div>
<div class="field-error" *ngIf="control?.touched && control?.invalid">
  <small>Senha é obrigatória</small>
</div>
